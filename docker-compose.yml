services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      # Supabase connection string goes in a root .env file (see README).
      # Example: DATABASE_URL=postgresql://postgres.abcdefgh:PASSWORD@aws-0-region.pooler.supabase.com:5432/postgres?sslmode=require
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
